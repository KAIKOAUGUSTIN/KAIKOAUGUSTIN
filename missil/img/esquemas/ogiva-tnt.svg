<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="780" height="400" viewBox="0 0 780 400" font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><title>A ogiva de TNT</title><defs><linearGradient id="glint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b070ff" stop-opacity="0"/><stop offset="0.45" stop-color="#c890ff" stop-opacity="0.55"/><stop offset="0.55" stop-color="#e0c0ff" stop-opacity="0.7"/><stop offset="1" stop-color="#b070ff" stop-opacity="0"/></linearGradient><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26282c"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d33a2c"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c8fb0"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4fc9"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a00"/></marker><marker id="ah-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0fa3c6"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f96"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b12"/></marker><radialGradient id="blast"><stop offset="0" stop-color="#fff2a8"/><stop offset="0.45" stop-color="#ffb347"/><stop offset="1" stop-color="#e2541c" stop-opacity="0.75"/></radialGradient></defs><rect x="1" y="1" width="778" height="398" rx="12" fill="#fbfaf6" stroke="#d6d2c6" stroke-width="2"/><text x="22.0" y="34.0" font-size="19" fill="#26282c" font-weight="bold" text-anchor="start">A ogiva de TNT</text><text x="22.0" y="56.0" font-size="13.5" fill="#5d6168" font-weight="normal" text-anchor="start">Visto de cima. A TNT do silo vira uma explosão só ou uma cascata.</text><rect x="22" y="72" width="360" height="246" rx="10" fill="#f1ede2"/><rect x="398" y="72" width="360" height="246" rx="10" fill="#f1ede2"/><text x="40.0" y="100.0" font-size="16" fill="#26282c" font-weight="bold" text-anchor="start">Até 20 TNT</text><circle cx="202" cy="202" r="66" fill="url(#blast)" opacity="0.85"/><circle cx="202" cy="202" r="66" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.6"/><text x="202.0" y="304.0" font-size="13" fill="#26282c" font-weight="normal" text-anchor="middle">1 explosão (1 TNT = uma TNT normal)</text><text x="416.0" y="100.0" font-size="16" fill="#26282c" font-weight="bold" text-anchor="start">Mais de 20 TNT</text><circle cx="578.0" cy="204.0" r="94.0" stroke="#7a5a3a" stroke-width="2" fill="none" stroke-dasharray="6 5" opacity="1"/><circle cx="578.0" cy="148.0" r="28" fill="url(#blast)" opacity="0.75"/><circle cx="578.0" cy="148.0" r="28" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.6"/><circle cx="626.4974226119285" cy="176.0" r="28" fill="url(#blast)" opacity="0.75"/><circle cx="626.4974226119285" cy="176.0" r="28" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.6"/><circle cx="626.4974226119285" cy="232.0" r="28" fill="url(#blast)" opacity="0.75"/><circle cx="626.4974226119285" cy="232.0" r="28" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.6"/><circle cx="578.0" cy="260.0" r="28" fill="url(#blast)" opacity="0.75"/><circle cx="578.0" cy="260.0" r="28" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.6"/><circle cx="529.5025773880715" cy="232.0" r="28" fill="url(#blast)" opacity="0.75"/><circle cx="529.5025773880715" cy="232.0" r="28" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.6"/><circle cx="529.5025773880715" cy="176.0" r="28" fill="url(#blast)" opacity="0.75"/><circle cx="529.5025773880715" cy="176.0" r="28" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.6"/><circle cx="578" cy="204" r="38" fill="url(#blast)" opacity="0.85"/><circle cx="578" cy="204" r="38" fill="none" stroke="#c0392b" stroke-width="1.5" opacity="0.6"/><circle cx="578.0" cy="144.0" r="10" fill="#ffd23f" stroke="#1d1d1d" stroke-width="1.5"/><text x="578.0" y="148.5" font-size="12" fill="#1d1d1d" font-weight="bold" text-anchor="middle">1</text><circle cx="629.9615242270663" cy="174.0" r="10" fill="#ffd23f" stroke="#1d1d1d" stroke-width="1.5"/><text x="630.0" y="178.5" font-size="12" fill="#1d1d1d" font-weight="bold" text-anchor="middle">2</text><circle cx="629.9615242270663" cy="234.0" r="10" fill="#ffd23f" stroke="#1d1d1d" stroke-width="1.5"/><text x="630.0" y="238.5" font-size="12" fill="#1d1d1d" font-weight="bold" text-anchor="middle">3</text><circle cx="578.0" cy="264.0" r="10" fill="#ffd23f" stroke="#1d1d1d" stroke-width="1.5"/><text x="578.0" y="268.5" font-size="12" fill="#1d1d1d" font-weight="bold" text-anchor="middle">4</text><circle cx="526.0384757729337" cy="234.0" r="10" fill="#ffd23f" stroke="#1d1d1d" stroke-width="1.5"/><text x="526.0" y="238.5" font-size="12" fill="#1d1d1d" font-weight="bold" text-anchor="middle">5</text><circle cx="526.0384757729337" cy="174.0" r="10" fill="#ffd23f" stroke="#1d1d1d" stroke-width="1.5"/><text x="526.0" y="178.5" font-size="12" fill="#1d1d1d" font-weight="bold" text-anchor="middle">6</text><text x="578.0" y="304.0" font-size="13" fill="#26282c" font-weight="normal" text-anchor="middle">centro + anel de 6, uma por tick, girando</text><text x="700.0" y="128.0" font-size="12" fill="#7a5a3a" font-weight="normal" text-anchor="middle">cratera</text><text x="40.0" y="350.0" font-size="13.5" fill="#26282c" font-weight="bold" text-anchor="start">64 TNT (o máximo padrão) ≈ 64 TNT separadas: cratera de ~21 blocos de raio em terra (~17 em pedra).</text><text x="40.0" y="372.0" font-size="13" fill="#5d6168" font-weight="normal" text-anchor="start">Só quebra blocos com a regra mobGriefing ligada. Plugins de proteção de região conseguem bloquear.</text></svg>