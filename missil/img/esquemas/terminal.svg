ont-weight="normal" text-anchor="start">cancela</text><text x="360.0" y="279.0" font-size="16" fill="#26282c" font-weight="bold" text-anchor="start">No mapa</text><rect x="352" y="287" width="404" height="84" rx="6" fill="#2b2b2b"/><circle cx="368" cy="301" r="6" fill="#2ecc71" stroke="#222" stroke-width="1"/><text x="384.0" y="305.0" font-size="11.5" fill="#f2f2f2" font-weight="normal" text-anchor="start">aliados</text><circle cx="564" cy="301" r="6" fill="#e53935" stroke="#222" stroke-width="1"/><text x="580.0" y="305.0" font-size="11.5" fill="#f2f2f2" font-weight="normal" text-anchor="start">inimigos, com nome</text><rect x="362" y="319" width="12" height="12" fill="#f1d21f" stroke="#222" stroke-width="1"/><text x="384.0" y="329.0" font-size="11.5" fill="#f2f2f2" font-weight="normal" text-anchor="start">seus equipamentos</text><rect x="558" y="319" width="12" height="12" fill="#e53935" stroke="#222" stroke-width="1"/><text x="580.0" y="329.0" font-size="11.5" fill="#f2f2f2" font-weight="normal" text-anchor="start">equipamento inimigo</text><circle cx="368" cy="349" r="6" fill="#a64dff" stroke="#222" stroke-width="1"/><text x="384.0" y="353.0" font-size="11.5" fill="#f2f2f2" font-weight="normal" text-anchor="start">míssil e impacto previsto</text><path d="M564,342 l7,7 l-7,7 l-7,-7 z" fill="#ffd75e" stroke="#222" stroke-width="1"/><text x="580.0" y="353.0" font-size="11.5" fill="#f2f2f2" font-weight="normal" text-anchor="start">satélite</text></svg>