<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="780" height="466" viewBox="0 0 780 466" font-family="'Segoe UI','Helvetica Neue',Arial,'DejaVu Sans',sans-serif"><title>Besta: travar e disparar</title><defs><linearGradient id="glint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b070ff" stop-opacity="0"/><stop offset="0.45" stop-color="#c890ff" stop-opacity="0.55"/><stop offset="0.55" stop-color="#e0c0ff" stop-opacity="0.7"/><stop offset="1" stop-color="#b070ff" stop-opacity="0"/></linearGradient><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#26282c"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d33a2c"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9e5b"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c8fb0"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b4fc9"/></marker><marker id="ah-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c98a00"/></marker><marker id="ah-aqua" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0fa3c6"/></marker><marker id="ah-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8f96"/></marker><marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e07b12"/></marker></defs><rect x="1" y="1" width="778" height="464" rx="12" fill="#fbfaf6" stroke="#d6d2c6" stroke-width="2"/><text x="22.0" y="34.0" font-size="19" fill="#26282c" font-weight="bold" text-anchor="start">Besta: travar e disparar</text><text x="22.0" y="56.0" font-size="13.5" fill="#5d6168" font-weight="normal" text-anchor="start">O que você vê na tela no modo TELEGUIADO.</text><clipPath id="scr"><rect x="22" y="70" width="380" height="300" rx="10"/></clipPath><g clip-path="url(#scr)"><rect x="22" y="70" width="380" height="300" fill="#8fc3ea"/><rect x="22" y="280" width="380" height="90" fill="#6aa83a"/><circle cx="212.0" cy="210.0" r="200.0" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-dasharray="6 6" opacity="0.9"/><circle cx="212.0" cy="210.0" r="86.0" stroke="#e07b12" stroke-width="2" fill="none" stroke-dasharray="5 4" opacity="1"/><circle cx="212.0" cy="210.0" r="43.0" stroke="#f1d21f" stroke-width="2.5" fill="none" opacity="1"/></g><path d="M203.0,210 h18 M212.0,201 v18" stroke="#fff" stroke-width="2"/><g transform="translate(230.0,196.0) rotate(-8) scale(0.9)"><path d="M-18,-2 L4,-14 L10,-2 Z" fill="#9a9ab8" stroke="#4a4a5a" stroke-width="1"/><rect x="-16" y="-3" width="26" height="6" fill="#c0392b" stroke="#3a1a1a" stroke-width="0.8"/><rect x="10" y="-4" width="8" height="8" fill="#c8946a" stroke="#3a2a1a" stroke-width="0.8"/><rect x="10" y="-4" width="8" height="3" fill="#3a2410"/></g><text x="230.0" y="180.0" font-size="15" fill="#ff3b30" font-weight="bold" text-anchor="middle">[ ◆ ]</text><g transform="translate(94.0,148.0) rotate(10) scale(0.8)"><path d="M-18,-2 L4,-14 L10,-2 Z" fill="#9a9ab8" stroke="#4a4a5a" stroke-width="1"/><rect x="-16" y="-3" width="26" height="6" fill="#c0392b" stroke="#3a1a1a" stroke-width="0.8"/><rect x="10" y="-4" width="8" height="8" fill="#c8946a" stroke="#3a2a1a" stroke-width="0.8"/><rect x="10" y="-4" width="8" height="3" fill="#3a2410"/></g><text x="94.0" y="132.0" font-size="13" fill="#ff3b30" font-weight="bold" text-anchor="middle">[ ◆ ]</text><rect x="256.0" y="217.0" width="135.2" height="20.0" rx="4" fill="#ffffff" fill-opacity="0.9"/><text x="260.0" y="230.0" font-size="12" fill="#7a6400" font-weight="bold" text-anchor="start">7,5°: começa a travar</text><rect x="278.0" y="269.0" width="131.6" height="20.0" rx="4" fill="#ffffff" fill-opacity="0.9"/><text x="282.0" y="282.0" font-size="12" fill="#9a4f00" font-weight="bold" text-anchor="start">15°: continua travado</text><rect x="30.0" y="343.0" width="215.6" height="20.0" rx="4" fill="#ffffff" fill-opacity="0.9"/><text x="34.0" y="356.0" font-size="12" fill="#26282c" font-weight="bold" text-anchor="start">35° (Multishot): mantém as travas</text><rect x="92" y="78" width="240" height="20" rx="4" fill="#000" opacity="0.55"/><text x="212.0" y="93.0" font-size="12.5" fill="#ff5555" font-weight="bold" text-anchor="middle">TRAVADO Steve — 42 m</text><text x="422.0" y="96.0" font-size="16" fill="#26282c" font-weight="bold" text-anchor="start">Passo a passo</text><circle cx="432" cy="119" r="11" fill="#ffd23f" stroke="#1d1d1d" stroke-width="1.5"/><text x="432.0" y="123.5" font-size="12" fill="#1d1d1d" font-weight="bold" text-anchor="middle">1</text><text x="452.0" y="124.0" font-size="13" fill="#26282c" font-weight="normal" text-anchor="start">Carregue a besta com o Foguete Teleguiado.</text><circle cx="432" cy="149" r="11" fill="#ffd23f" stroke="#1d1d1d" stroke-width="1.5"/><text x="432.0" y="153.5" font-size="12" fill="#1d1d1d" font-weight="bold" text-anchor="middle">2</text><text x="452.0" y="154.0" font-size="13" fill="#26282c" font-weight="normal" text-anchor="start">Mire: o alvo precisa estar a até 7,5° da mira e</text><text x="452.0" y="172.0" font-size="13" fill="#26282c" font-weight="normal" text-anchor="start">a até 96 m.</text><circle cx="432" cy="197" r="11" fill="#ffd23f" stroke="#1d1d1d" stroke-width="1.5"/><text x="432.0" y="201.5" font-size="12" fill="#1d1d1d" font-weight="bold" text-anchor="middle">3</text><text x="452.0" y="202.0" font-size="13" fill="#26282c" font-weight="normal" text-anchor="start">Espere a barra: TRAVANDO (1,2 s) → TRAVADO.</text><circle cx="432" cy="227" r="11" fill="#ffd23f" stroke="#1d1d1d" stroke-width="1.5"/><text x="432.0" y="231.5" font-size="12" fill="#1d1d1d" font-weight="bold" text-anchor="middle">4</text><text x="452.0" y="232.0" font-size="13" fill="#26282c" font-weight="normal" text-anchor="start">Dispare. Sem trava, o foguete voa reto.</text><text x="422.0" y="270.0" font-size="12.5" fill="#26282c" font-weight="normal" text-anchor="start">Mísseis e drones inimigos: trava de 128 m</text><text x="422.0" y="287.5" font-size="12.5" fill="#26282c" font-weight="normal" text-anchor="start">em 0,3 s; a explosão derruba o que estiver</text><text x="422.0" y="305.0" font-size="12.5" fill="#26282c" font-weight="normal" text-anchor="start">a até 5 m.</text><text x="422.0" y="322.5" font-size="12.5" fill="#26282c" font-weight="normal" text-anchor="start"></text><text x="422.0" y="340.0" font-size="12.5" fill="#26282c" font-weight="normal" text-anchor="start">Multishot: trava até 3 alvos, 1 foguete</text><text x="422.0" y="357.5" font-size="12.5" fill="#26282c" font-weight="normal" text-anchor="start">para cada.</text><text x="422.0" y="375.0" font-size="12.5" fill="#26282c" font-weight="normal" text-anchor="start"></text><text x="422.0" y="392.5" font-size="12.5" fill="#26282c" font-weight="normal" text-anchor="start">Shift + F: troca TELEGUIADO ⇄ MANUAL FPV.</text><text x="30.0" y="428.0" font-size="12.5" fill="#26282c" font-weight="normal" text-anchor="start">No MANUAL FPV a câmera vai no foguete e ele vira para onde você olha; Shift sai. Seu corpo fica</text><text x="30.0" y="447.0" font-size="12.5" fill="#26282c" font-weight="normal" text-anchor="start">parado no lugar (um boneco com a sua skin): se ele levar dano, o FPV acaba.</text></svg>